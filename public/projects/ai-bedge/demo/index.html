      avatar.innerHTML = `<span class="gemini-icon">${Utils.geminiSVG()}</span>`;
      
      const title = Utils.el('div', 'exec-header-title', '文件整理助手');
      
      const status = Utils.el('div', 'exec-header-status');
      status.innerHTML = `
        <div class="exec-status-dot"></div>
        <span class="exec-status-text">执行中</span>
      `;
      
      const actions = Utils.el('div', 'exec-header-actions');
      
      const pauseBtn = Utils.el('button', 'exec-icon-btn');
      pauseBtn.innerHTML = '<i data-lucide="pause"></i>';
      pauseBtn.title = '暂停';
      pauseBtn.addEventListener('click', () => {
        if (isPaused) resume();
        else pause();
      });
      
      const closeBtn = Utils.el('button', 'exec-icon-btn');
      closeBtn.innerHTML = '<i data-lucide="x"></i>';
      closeBtn.title = '收起';
      closeBtn.addEventListener('click', hidePanel);
      
      actions.appendChild(pauseBtn);
      actions.appendChild(closeBtn);
      
      header.appendChild(avatar);
      header.appendChild(title);
      header.appendChild(status);
      header.appendChild(actions);
      
      return header;
    }
    
    // ========== 渲染所有操作项 ==========
    function renderAllOps() {
      const listEl = Utils.$('#execOpsList');
      if (!listEl) return;
      
      listEl.innerHTML = '';
      operations.forEach((op, index) => {
        const item = buildExecOpItem(op, index);
        listEl.appendChild(item);
      });
      
      // 更新视图类
      updateViewClass();
    }
    
    // ========== 构建单个执行项 ==========
    function buildExecOpItem(op, index) {
      const state = opStates[op.id] || { status: 'pending' };
      const status = state.status;
      
      const item = Utils.el('div', `exec-op-item ${status}`);
      item.dataset.opId = op.id;
      
      // 敏感操作多加 500ms 入场延迟
      const baseDelay = index * 150;
      const extraDelay = op.sensitive ? 500 : 0;
      item.style.animationDelay = `${baseDelay + extraDelay}ms`;
      
      // L3 操作加抖动
      if (op.risk_level === 'L3') {
        item.classList.add('shake');
      }
      // 敏感操作加样式
      if (op.sensitive) {
        item.classList.add('sensitive');
      }
      
      // 状态图标
      const statusEl = Utils.el('div', `exec-op-status ${status}`, STATUS_ICONS[status] || '○');
      statusEl.id = `execStatus_${op.id}`;
      
      // 内容
      const content = Utils.el('div', 'exec-op-content');
      
      // 描述
      const desc = Utils.el('div', 'exec-op-desc');
      const descText = Utils.el('span', '', op.description);
      desc.appendChild(descText);
      
      // 敏感数据标签
      if (op.sensitive) {
        const sensitiveTag = Utils.el('span', 'sensitive-tag', '⚠ 敏感数据');
        desc.appendChild(sensitiveTag);
      }
      
      // Meta
      const meta = Utils.el('div', 'exec-op-meta');
      const riskClass = Utils.getRiskClass(op.risk_level);
      
      let timeText = '';
      if (status === 'completed') {
        timeText = `${(state.duration / 1000).toFixed(1)}s`;
      } else if (status === 'running') {
        timeText = '进行中…';
      } else if (status === 'waiting') {
        timeText = '等待中…';
      } else if (status === 'skipped') {
        timeText = '已跳过';
      } else {
        timeText = '等待中…';
      }
      
      meta.innerHTML = `
        <span class="risk-badge ${riskClass}">${op.risk_level}</span>
        <span class="op-category">${op.categoryLabel || op.category}</span>
        <span class="exec-op-time" id="execTime_${op.id}">${timeText}</span>
      `;
      
      content.appendChild(desc);
      content.appendChild(meta);
      
      // 意图说明
      if (op.intent) {
        const intent = Utils.el('div', 'exec-op-intent', `💬 ${op.intent}`);
        content.appendChild(intent);
      }
      
      // 技术命令
      if (op.tech_command) {
        const techCmd = Utils.el('div', 'exec-op-tech-cmd', op.tech_command);
        content.appendChild(techCmd);
      }
      
      // 子进度（仅运行中显示）
      if (status === 'running' && op.category === 'move_file') {
        const subProgress = Utils.el('div', 'exec-op-subprogress');
        subProgress.id = `execSubProgress_${op.id}`;
        subProgress.innerHTML = `
          <span>正在移动 0/23…</span>
          <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
        `;
        content.appendChild(subProgress);
      }
      
      item.appendChild(statusEl);
      item.appendChild(content);
      
      return item;
    }
    
    // ========== 执行下一步 ==========
    function executeNext() {
      if (!isRunning || isPaused) return;
      
      // 找到下一个待执行的操作
      while (currentIndex < operations.length) {
        const op = operations[currentIndex];
        const state = opStates[op.id];
        
        if (state.status === 'pending') {
          executeOp(op);
          return;
        }
        currentIndex++;
      }
      
      // 全部完成
      finishExecution();
    }
    
    // ========== 执行单个操作 ==========
    function executeOp(op) {
      opStates[op.id].status = 'running';
      opStates[op.id].startTime = Date.now();
      
      // 更新 UI
      updateOpItem(op.id);
      scrollToLatest();
      
      // 更新进度
      updateProgress();
      
      // 模拟执行时长
      const duration = getOpDuration(op);
      
      // 如果是移动文件，显示子进度
      if (op.category === 'move_file') {
        simulateSubProgress(op, duration);
      }
      
      // 执行完成回调
      execTimer = setTimeout(() => {
        completeOp(op);
      }, duration);
    }
    
    // ========== 获取操作模拟时长 ==========
    function getOpDuration(op) {
      const baseTimes = {
        'read_file': 300,
        'create_folder': 200,
        'move_file': 1200,
        'delete_file': 800,
      };
      return baseTimes[op.category] || 600;
    }
    
    // ========== 模拟子进度 ==========
    function simulateSubProgress(op, totalDuration) {
      const subEl = Utils.$(`#execSubProgress_${op.id}`);
      if (!subEl) return;
      
      const totalSteps = 10;
      const stepInterval = totalDuration / totalSteps;
      let step = 0;
      
      const interval = setInterval(() => {
        step++;
        const progress = (step / totalSteps) * 100;
        const count = Math.round(step / totalSteps * 23);
        
        const fill = subEl.querySelector('.progress-fill');
        const text = subEl.querySelector('span');
        if (fill) fill.style.width = `${progress}%`;
        if (text) text.textContent = `正在移动 ${count}/23…`;
        
        if (step >= totalSteps) {
          clearInterval(interval);
        }
      }, stepInterval);
    }
    
    // ========== 完成操作 ==========
    function completeOp(op) {
      const state = opStates[op.id];
      state.status = 'completed';
      state.endTime = Date.now();
      state.duration = state.endTime - state.startTime;
      
      // 更新 UI
      updateOpItem(op.id);
      updateProgress();
      
      // 触发文件管理器动画
      triggerFileAnimation(op);
      
      // 显示反悔条（L2+）
      if (op.risk_level === 'L2' || op.risk_level === 'L3') {
        showUndoBar(op);
      }
      
      // 派发事件
      document.dispatchEvent(new CustomEvent('opCompleted', {
        detail: { op, index: currentIndex }
      }));
      
      // 继续下一个
      currentIndex++;
      setTimeout(() => executeNext(), 600);
    }
    
    // ========== 显示反悔条 ==========
    function showUndoBar(op) {
      const item = panelEl.querySelector(`[data-op-id="${op.id}"]`);
      if (!item) return;
      
      const seconds = op.risk_level === 'L3' ? 10 : 3;
      
      const undoBar = Utils.el('div', 'exec-op-undo-bar');
      undoBar.id = `undoBar_${op.id}`;
      undoBar.innerHTML = `
        <span class="undo-text">已完成</span>
        <span class="undo-countdown">${seconds}s</span>
        <button class="undo-btn">撤销</button>
      `;
      
      undoBar.querySelector('.undo-btn').addEventListener('click', () => {
        undoOp(op);
      });
      
      const content = item.querySelector('.exec-op-content');
      content.appendChild(undoBar);
      
      // 倒计时
      let secondsLeft = seconds;
      undoTimers[op.id] = {
        timer: setInterval(() => {
          secondsLeft--;
          const countdownEl = undoBar.querySelector('.undo-countdown');
          if (countdownEl) {
            countdownEl.textContent = `${secondsLeft}s`;
            // 最后3秒变红并脉冲
            if (secondsLeft <= 3) {
              countdownEl.classList.add('urgent');
            }
          }
          if (secondsLeft <= 0) {
            clearInterval(undoTimers[op.id].timer);
            // 向上收起动画
            undoBar.classList.add('hide');
            setTimeout(() => undoBar.remove(), 300);
            delete undoTimers[op.id];
          }
        }, 1000),
        secondsLeft: () => secondsLeft
      };
    }
    
    // ========== 撤销操作 ==========
    function undoOp(op) {
      // 清除倒计时
      if (undoTimers[op.id]) {
        clearInterval(undoTimers[op.id].timer);
        delete undoTimers[op.id];
      }
      
      // 移除反悔条
      const undoBar = Utils.$(`#undoBar_${op.id}`);
      if (undoBar) undoBar.remove();
      
      // 状态回退
      opStates[op.id].status = 'pending';
      opStates[op.id].duration = 0;
      
      // 更新 UI
      updateOpItem(op.id);
      updateProgress();
      
      // 文件回滚
      if (op.category === 'move_file' && App.modules.finder) {
        // 简化：标记为已回滚
      }
      
      document.dispatchEvent(new CustomEvent('opUndone', { detail: { op } }));
    }
    
    // ========== 更新单个操作项 UI ==========
    function updateOpItem(opId) {
      if (!panelEl) return;
      
      const item = panelEl.querySelector(`[data-op-id="${opId}"]`);
      if (!item) return;
      
      const op = operations.find(o => o.id === opId);
      const state = opStates[opId];
      if (!op || !state) return;
      
      // 更新 item 类名
      item.className = `exec-op-item ${state.status}`;
      
      // 更新状态图标
      const statusEl = item.querySelector('.exec-op-status');
      if (statusEl) {
        statusEl.className = `exec-op-status ${state.status}`;
        statusEl.textContent = STATUS_ICONS[state.status] || '○';
      }
      
      // 更新时间
      const timeEl = item.querySelector('.exec-op-time');
      if (timeEl) {
        if (state.status === 'completed') {
          timeEl.textContent = `${(state.duration / 1000).toFixed(1)}s`;
        } else if (state.status === 'running') {
          timeEl.textContent = '进行中…';
        } else if (state.status === 'skipped') {
          timeEl.textContent = '已跳过';
        } else if (state.status === 'waiting') {
          timeEl.textContent = '等待确认…';
        } else {
          timeEl.textContent = '等待中…';
        }
      }
    }
    
    // ========== 更新进度 ==========
    function updateProgress() {
      const completed = Object.values(opStates).filter(s => s.status === 'completed' || s.status === 'skipped').length;
      const total = operations.length;
      const percent = Math.round((completed / total) * 100);
      
      const countEl = Utils.$('#execProgressCount');
      const fillEl = Utils.$('#execProgressFill');
      
      if (countEl) countEl.textContent = `${completed}/${total}`;
      if (fillEl) fillEl.style.width = `${percent}%`;
    }
    
    // ========== 滚动到最新项 ==========
    function scrollToLatest() {
      const list = Utils.$('#execOpsList');
      if (list) {
        list.scrollTop = list.scrollHeight;
      }
    }
    
    // ========== 触发文件管理器动画 ==========
    function triggerFileAnimation(op) {
      if (!App.modules.finder) return;
      
      switch (op.category) {
        case 'create_folder':
          // 创建目录 - 无需动画
          break;
        case 'move_file':
          if (op.description.includes('截图')) {
            App.modules.finder.moveFilesToFolder('screenshot');
          } else if (op.description.includes('税务')) {
            App.modules.finder.moveFilesByKeyword(['税务', '税单'], 'tax');
          } else if (op.description.includes('PDF')) {
            // 移动大部分 PDF（排除税务文件和重复 report 文件，它们在后续步骤单独处理）
            const pdfFiles = App.modules.finder.getFiles().filter(f => 
              f.name.endsWith('.pdf') && 
              !f.name.includes('税务') && 
              !f.name.includes('税单') &&
              !f.name.includes('report(')
            );
            const pdfNames = pdfFiles.map(f => f.name);
            if (pdfNames.length > 0) {
              App.modules.finder.moveFilesByKeyword(pdfNames, 'pdf_general');
            }
          } else if (op.description.includes('安装包')) {
            App.modules.finder.moveFilesToFolder('installer');
          }
          break;
        case 'delete_file':
          App.modules.finder.moveFilesByKeyword(['report(1)', 'report(2)'], 'duplicate');
          break;
      }
    }
    
    // ========== 暂停 ==========
    function pause() {
      if (!isRunning || isPaused) return;
      isPaused = true;
      if (execTimer) clearTimeout(execTimer);
      
      if (App.modules.badge) {
        App.modules.badge.setState('alert');
      }
      
      document.dispatchEvent(new CustomEvent('execPaused'));
    }
    
    // ========== 恢复 ==========
    function resume() {
      if (!isRunning || !isPaused) return;
      isPaused = false;
      
      if (App.modules.badge) {
        App.modules.badge.setState('thinking');
      }
      
      executeNext();
      document.dispatchEvent(new CustomEvent('execResumed'));
    }
    
    // ========== 停止 ==========
    function stop() {
      isRunning = false;
      isPaused = false;
      if (execTimer) clearTimeout(execTimer);
      
      // 清除所有反悔计时器
      Object.values(undoTimers).forEach(t => clearInterval(t.timer));
      undoTimers = {};
      
      document.dispatchEvent(new CustomEvent('execStopped'));
    }
    
    // ========== 全部完成 ==========
    function finishExecution() {
      isRunning = false;
      
      const completed = Object.values(opStates).filter(s => s.status === 'completed').length;
      const skipped = Object.values(opStates).filter(s => s.status === 'skipped').length;
      
      if (App.modules.badge) {
        App.modules.badge.setState('idle');
      }
      
      // 更新状态灯
      const statusDot = panelEl?.querySelector('.exec-status-dot');
      const statusText = panelEl?.querySelector('.exec-status-text');
      if (statusDot) {
        statusDot.style.background = 'var(--risk-l0)';
        statusDot.style.animation = 'none';
      }
      if (statusText) {
        statusText.textContent = '已完成';
        statusText.style.color = 'var(--risk-l0)';
      }
      
      document.dispatchEvent(new CustomEvent('execFinished', {
        detail: { completed, skipped, total: operations.length }
      }));
    }
    
    // ========== 标记为待复查（故事模式用）==========
    function markForReview(opId, reason) {
      if (!opStates[opId]) return;
      
      opStates[opId].status = 'skipped';
      opStates[opId].reviewReason = reason;
      updateOpItem(opId);
      
      // 添加待复查标记
      const item = panelEl?.querySelector(`[data-op-id="${opId}"]`);
      if (item) {
        const desc = item.querySelector('.exec-op-desc');
        if (desc) {
          desc.style.color = 'var(--risk-l2)';
          desc.textContent += '（待复查）';
        }
      }
      
      updateProgress();
    }
    
    // ========== 强制完成所有 ==========
    function completeAll() {
      operations.forEach(op => {
        if (opStates[op.id].status === 'pending' || opStates[op.id].status === 'running') {
          opStates[op.id].status = 'completed';
          opStates[op.id].duration = getOpDuration(op);
          updateOpItem(op.id);
        }
      });
      updateProgress();
      finishExecution();
    }
    
    // ========== 隐藏面板 ==========
    function hidePanel() {
      const badgeContainer = Utils.$('#aiBadgeContainer');
      if (!badgeContainer) return;
      
      badgeContainer.innerHTML = '';
      
      // 恢复徽章
      if (App.modules.badge) {
        App.modules.badge.toggleExpand(true);
      }
    }
    
    // ========== 切换视图 ==========
    function toggleView(view) {
      currentView = view;
      
      // 更新按钮状态
      const toggleBtns = panelEl?.querySelectorAll('.exec-view-toggle button');
      toggleBtns?.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.view === view);
      });
      
      updateViewClass();
    }
    
    function updateViewClass() {
      const list = Utils.$('#execOpsList');
      if (!list) return;
      
      list.classList.remove('exec-view-human', 'exec-view-tech');
      list.classList.add(`exec-view-${currentView}`);
    }
    
    // ========== 执行面板拖拽 ==========
    function initExecDrag() {
      const header = Utils.$('#execHeader');
      const floating = Utils.$('#execFloating');
      if (!header || !floating) return;
      
      let isDragging = false;
      let startX = 0, startY = 0;
      let startRight = 0, startBottom = 0;
      
      header.addEventListener('mousedown', (e) => {
        if (e.target.closest('.exec-icon-btn')) return;
        
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        
        const rect = floating.getBoundingClientRect();
        startRight = window.innerWidth - rect.right;
        startBottom = window.innerHeight - rect.bottom;
        
        floating.style.right = startRight + 'px';
        floating.style.bottom = startBottom + 'px';
        floating.style.left = 'auto';
        floating.style.top = 'auto';
        
        e.preventDefault();
      });
      
      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        
        let newRight = startRight - dx;
        let newBottom = startBottom - dy;
        
        newRight = Math.max(0, Math.min(newRight, window.innerWidth - 100));
        newBottom = Math.max(28, Math.min(newBottom, window.innerHeight - 100));
        
        floating.style.right = newRight + 'px';
        floating.style.bottom = newBottom + 'px';
      });
      
      document.addEventListener('mouseup', () => {
        isDragging = false;
      });
    }
    
    return {
      init
    };
  })();
  
  // 初始化执行流
  document.addEventListener('DOMContentLoaded', () => {
    ExecStream.init();
  });
  
  if (document.readyState !== 'loading') {
    ExecStream.init();
  }
  
  /* ========================================
   *  模块 6：操作历史与回滚
   * ======================================== */
  
  const HistoryPanel = (() => {
    let isOpen = false;
    let overlayEl = null;
    let modalEl = null;
    let currentFilter = 'current'; // all / current
    let historyOps = []; // 历史操作记录
    let rolledBackIds = new Set(); // 已回滚的操作ID
    let mistakeOpId = null; // 误操作ID
    let selectMode = false; // 选择性回滚模式
    let selectedIds = new Set();
    let initialScore = 62; // 任务开始前的信任分
    let finalScore = 62;   // 当前信任分（随回滚变化）
    
    // ========== 初始化历史数据 ==========
    function buildHistoryFromOps(ops, execStates) {
      historyOps = ops.map((op, index) => {
        const state = execStates[op.id] || { status: 'completed', duration: 500 };
        return {
          ...op,
          execStatus: state.status,
          duration: state.duration || 500,
          time: formatTime(index),
          rolledBack: false,
          isMistake: false,
          mistakeReason: ''
        };
      });
      rolledBackIds = new Set();
      mistakeOpId = null;
    }
    
    function formatTime(index) {
      const base = new Date();
      base.setSeconds(base.getSeconds() - (7 - index) * 2);
      return `${String(base.getHours()).padStart(2, '0')}:${String(base.getMinutes()).padStart(2, '0')}:${String(base.getSeconds()).padStart(2, '0')}`;
    }
    
    // ========== 打开面板 ==========
    function open(options = {}) {
      if (isOpen) return;
      
      // 如果没有历史数据，用 mock 数据
      if (historyOps.length === 0) {
        const mockStates = {};
        App.state.currentOperations.forEach(op => {
          mockStates[op.id] = { status: op.id === 'op_6' ? 'skipped' : 'completed', duration: 500 + Math.random() * 1000 };
        });
        buildHistoryFromOps(App.state.currentOperations, mockStates);
      }
      
      // 初始化分数状态
      initialScore = options.initialScore || 62;
      finalScore = options.finalScore || App.state.trustScore;
      
      // 标记误操作
      if (options.mistakeOpId) {
        mistakeOpId = options.mistakeOpId;
        const op = historyOps.find(o => o.id === mistakeOpId);
        if (op) {
          op.isMistake = true;
          op.mistakeReason = options.mistakeReason || '检测到误操作';
        }
      }
      
      render();
      isOpen = true;
      
      document.dispatchEvent(new CustomEvent('historyPanelOpened'));
    }
    
    // ========== 关闭面板 ==========
    function close() {
      if (!isOpen || !overlayEl) return;
      
      overlayEl.classList.remove('visible');
      setTimeout(() => {
        if (overlayEl && overlayEl.parentNode) {
          overlayEl.parentNode.removeChild(overlayEl);
        }
        overlayEl = null;
        modalEl = null;
        isOpen = false;
        selectMode = false;
        selectedIds.clear();
      }, 300);
      
      document.dispatchEvent(new CustomEvent('historyPanelClosed'));
    }
    
    // ========== 渲染面板 ==========
    function render() {
      overlayEl = Utils.el('div', 'modal-overlay');
      overlayEl.addEventListener('click', (e) => {
        if (e.target === overlayEl) close();
      });
      
      modalEl = Utils.el('div', 'modal history-modal');
      
      // 头部
      const header = Utils.el('div', 'history-header');
      header.innerHTML = `
        <div class="history-title">📜 操作历史</div>
        <select class="history-filter" id="historyFilter">
          <option value="current" ${currentFilter === 'current' ? 'selected' : ''}>本次任务</option>
          <option value="all" ${currentFilter === 'all' ? 'selected' : ''}>全部历史</option>
        </select>
      `;
      
      // 任务摘要
      const summary = buildSummary();
      
      // 时间线
      const timeline = Utils.el('div', 'timeline-list');
      timeline.id = 'timelineList';
      
      // 底部操作栏
      const footer = Utils.el('div', 'history-footer');
      footer.innerHTML = `
        <button class="rollback-btn" id="rollbackStepBtn">↶ 单步回滚</button>
        <button class="rollback-btn" id="rollbackCheckpointBtn">⏱ 检查点回滚</button>
        <button class="rollback-btn" id="rollbackSelectiveBtn">☑ 选择性回滚</button>
        <button class="rollback-btn danger" id="rollbackAllBtn">↺ 全部回滚</button>
      `;
      
      modalEl.appendChild(header);
      modalEl.appendChild(summary);
      modalEl.appendChild(timeline);
      modalEl.appendChild(footer);
      overlayEl.appendChild(modalEl);
      
      const modalContainer = Utils.$('#modalContainer') || document.body;
      modalContainer.appendChild(overlayEl);
      
      requestAnimationFrame(() => {
        overlayEl.classList.add('visible');
      });
      
      // 渲染时间线
      renderTimeline();
      
      // 绑定事件
      Utils.$('#historyFilter').addEventListener('change', (e) => {
        currentFilter = e.target.value;
        renderTimeline();
      });
      
      Utils.$('#rollbackStepBtn').addEventListener('click', () => rollbackSingleStep());
      Utils.$('#rollbackCheckpointBtn').addEventListener('click', () => showCheckpointPicker());
      Utils.$('#rollbackSelectiveBtn').addEventListener('click', () => toggleSelectiveMode());
      Utils.$('#rollbackAllBtn').addEventListener('click', () => rollbackAll());
    }
    
    // ========== 构建摘要栏 ==========
    function buildSummary() {
      const total = historyOps.length;
      const completed = historyOps.filter(o => o.execStatus === 'completed' && !rolledBackIds.has(o.id)).length;
      const skipped = historyOps.filter(o => o.execStatus === 'skipped').length;
      
      const delta = finalScore - initialScore;
      const deltaText = delta >= 0 ? `+${delta}` : `${delta}`;
      const deltaClass = delta >= 0 ? 'delta-up' : 'delta-down';
      
      const summary = Utils.el('div', 'history-summary');
      summary.innerHTML = `
        <span class="history-summary-date">今天 14:${32 + total}</span>
        <span class="history-summary-status">${completed}/${total} 成功 · ${skipped} 个跳过</span>
        <span class="history-summary-score">
          信任分 ${initialScore} <span class="${deltaClass}">→ ${finalScore} (${deltaText})</span>
        </span>
      `;
      
      return summary;
    }
    
    // ========== 渲染时间线 ==========
    function renderTimeline() {
      const listEl = Utils.$('#timelineList');
      if (!listEl) return;
      
      listEl.innerHTML = '';
      
      const displayOps = currentFilter === 'current' 
        ? historyOps 
        : historyOps; // 简化：全部历史也用同一份
      
      displayOps.forEach((op, index) => {
        const item = buildTimelineItem(op, index);
        listEl.appendChild(item);
      });
    }
    
    // ========== 构建时间线项 ==========
    function buildTimelineItem(op, index) {
      const isRolledBack = rolledBackIds.has(op.id);
      const statusClass = isRolledBack ? 'rolled-back' 
        : op.execStatus === 'skipped' ? 'skipped' 
        : op.execStatus === 'failed' ? 'failed' 
        : 'completed';
      
      const item = Utils.el('div', `timeline-item ${statusClass}`);
      item.dataset.opId = op.id;
      item.style.animationDelay = `${index * 80}ms`;
      
      if (op.isMistake && !isRolledBack) {
        item.classList.add('highlighted');
      }
      
      // 选择性回滚 checkbox
      if (selectMode && op.execStatus === 'completed' && !isRolledBack) {
        const checkbox = Utils.el('input', 'timeline-select');
        checkbox.type = 'checkbox';
        checkbox.checked = selectedIds.has(op.id);
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) {
            selectedIds.add(op.id);
          } else {
            selectedIds.delete(op.id);
          }
        });
        item.appendChild(checkbox);
      }
      
      // 圆点
      const dot = Utils.el('div', `timeline-dot ${statusClass}`);
      item.appendChild(dot);
      
      // 内容
      const content = Utils.el('div', 'timeline-content');
      
      // 顶部行
      const topRow = Utils.el('div', 'timeline-top-row');
      const time = Utils.el('span', 'timeline-time', op.time);
      const desc = Utils.el('span', 'timeline-desc', op.description);
      topRow.appendChild(time);
      topRow.appendChild(desc);
      
      // Meta
      const meta = Utils.el('div', 'timeline-meta');
      const riskClass = Utils.getRiskClass(op.risk_level);
      const durationStr = op.execStatus === 'skipped' ? '已跳过' : `${(op.duration / 1000).toFixed(1)}s`;
      meta.innerHTML = `
        <span class="risk-badge ${riskClass}">${op.risk_level}</span>
        <span class="duration">${durationStr}</span>
      `;
      
      content.appendChild(topRow);
      content.appendChild(meta);
      
      // 误操作警告
      if (op.isMistake && !isRolledBack) {
        const warn = Utils.el('div', 'timeline-warn');
        warn.innerHTML = `
          <span class="warn-icon">⚠️</span>
          <span>${op.mistakeReason || '检测到误操作'}</span>
        `;
        content.appendChild(warn);
        
        // 回滚按钮
        const rollbackBtn = Utils.el('button', 'timeline-rollback-btn', '↩ 回滚此操作');
        rollbackBtn.addEventListener('click', () => {
          showRollbackPreview([op.id], 'single');
        });
        content.appendChild(rollbackBtn);
      }
      
      item.appendChild(content);
      return item;
    }
    
    // ========== 单步回滚 ==========
    function rollbackSingleStep() {
      // 找到最后一个已完成且未回滚的操作
      const lastCompleted = [...historyOps].reverse().find(
        op => op.execStatus === 'completed' && !rolledBackIds.has(op.id)
      );
      
      if (!lastCompleted) {
        alert('没有可回滚的操作');
        return;
      }
      
      showRollbackPreview([lastCompleted.id], 'single');
    }
    
    // ========== 全部回滚 ==========
    function rollbackAll() {
      const completedIds = historyOps
        .filter(op => op.execStatus === 'completed' && !rolledBackIds.has(op.id))
        .map(op => op.id);
      
      if (completedIds.length === 0) {
        alert('没有可回滚的操作');
        return;
      }
      
      showRollbackPreview(completedIds, 'all');
    }
    
    // ========== 检查点回滚：显示检查点列表 ==========
    function showCheckpointPicker() {
      // 生成检查点数据（基于已完成的操作）
      const checkpoints = buildCheckpoints();
      
      if (checkpoints.length === 0) {
        alert('暂无检查点');
        return;
      }

      const cpOverlay = Utils.el('div', 'modal-overlay');

        <div class="checkpoint-subtitle">回滚到指定检查点的状态</div>
      `;
      
      // 检查点列表
      const list = Utils.el('div', 'checkpoint-list');

      cpModal.appendChild(list);
      cpModal.appendChild(footer);

      modalContainer.appendChild(cpOverlay);
      
      requestAnimationFrame(() => {
        cpOverlay.classList.add('visible');
      });
      
      Utils.$('#cpCancelBtn').addEventListener('click', () => closeCheckpointPicker(cpOverlay));

    function closeCheckpointPicker(overlay) {
      overlay.classList.remove('visible');
      setTimeout(() => {
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
      }, 300);
    }
    
    // 构建检查点数据
    function buildCheckpoints() {
      const completedOps = historyOps.filter(
        op => op.execStatus === 'completed' && !rolledBackIds.has(op.id)
      );
      
      if (completedOps.length === 0) return [];
      
      const checkpoints = [];
      
      // 检查点1：扫描完成后
      if (completedOps.find(o => o.id === 'op_1')) {
        const rollbackOps = completedOps.filter(o => o.id !== 'op_1');
        checkpoints.push({
          name: '扫描完成',
          time: completedOps[0].time,
          desc: '刚扫描完文件夹，尚未执行任何修改',
          opCount: 1,
          rollbackCount: rollbackOps.length,
          opIds: rollbackOps.map(o => o.id)
        });
      }
      
      // 检查点2：目录创建完成
      if (completedOps.find(o => o.id === 'op_2')) {
        const rollbackOps = completedOps.filter(
          o => !['op_1', 'op_2'].includes(o.id)
        );
        if (rollbackOps.length > 0) {
          checkpoints.push({
            name: '目录创建完成',
            time: historyOps.find(o => o.id === 'op_2')?.time || '',
            desc: '分类目录已创建，文件尚未移动',
            opCount: 2,
            rollbackCount: rollbackOps.length,
            opIds: rollbackOps.map(o => o.id)
          });
        }
      }
      
      // 检查点3：截图归档完成
      if (completedOps.find(o => o.id === 'op_3')) {
        const rollbackOps = completedOps.filter(
          o => !['op_1', 'op_2', 'op_3'].includes(o.id)
        );
        if (rollbackOps.length > 0) {
          checkpoints.push({
            name: '截图归档完成',
            time: historyOps.find(o => o.id === 'op_3')?.time || '',
            desc: '截图已移动到截图目录',
            opCount: 3,
            rollbackCount: rollbackOps.length,
            opIds: rollbackOps.map(o => o.id)
          });
        }
      }
      
      // 检查点4：任务开始前（完整回滚）
      checkpoints.push({
        name: '任务开始前',
        time: '--:--:--',
        desc: '撤销所有修改，恢复到任务执行前状态',
        opCount: 0,
        rollbackCount: completedOps.length,
        opIds: completedOps.map(o => o.id)
      });
      
      return checkpoints;
    }
    
    // ========== 选择性回滚 ==========
    function toggleSelectiveMode() {
      const btn = Utils.$('#rollbackSelectiveBtn');
      
      if (!selectMode) {
        // 进入选择模式
        selectMode = true;
        selectedIds.clear();
        
        if (btn) {
          btn.textContent = '✓ 确认回滚';
          btn.style.background = 'rgba(52, 211, 153, 0.15)';
          btn.style.borderColor = 'rgba(52, 211, 153, 0.3)';
          btn.style.color = 'var(--risk-l0)';
        }
        
        renderTimeline();
      } else {
        // 退出选择模式
        const hasSelection = selectedIds.size > 0;
        selectMode = false;
        
        if (btn) {
          btn.textContent = '☑ 选择性回滚';
          btn.style.background = '';
          btn.style.borderColor = '';
          btn.style.color = '';
        }
        
        if (hasSelection) {
          // 有选中项，弹出回滚预览
          showRollbackPreview(Array.from(selectedIds), 'selective');
          // 不清空 selectedIds，预览确认后会处理
          // 不重新渲染，保持当前列表状态
        } else {
          // 没有选中项，直接退出选择模式
          renderTimeline();
        }
      }
    }
    
    // ========== 显示回滚预览 ==========
    function showRollbackPreview(opIds, mode) {

      const header = Utils.el('div', 'rollback-preview-header');
      header.innerHTML = `
        <div class="rollback-preview-title">↩️ 回滚预览</div>
        <div class="rollback-preview-subtitle">以下操作将被撤销，请确认</div>
      `;

      const body = Utils.el('div', 'rollback-preview-body');

      `;

    function closeRollbackPreview(overlay) {
      overlay.classList.remove('visible');
      setTimeout(() => {
        if (overlay && overlay.parentNode) {
          overlay.parentNode.removeChild(overlay);
        }
      }, 300);
    }
    
    // ========== 执行回滚 ==========
    function performRollback(opIds) {
      // 标记为已回滚
      opIds.forEach(id => rolledBackIds.add(id));
      
      // 更新历史数据
      historyOps.forEach(op => {
        if (opIds.includes(op.id)) {
          op.rolledBack = true;
        }
      });
      
      // 文件回滚动画
      rollbackFiles(opIds);
      
      // 信任分变化
      updateTrustScoreOnRollback(opIds);
      
      // 重新渲染时间线
      renderTimeline();
      updateSummary();
      
      // 重置选择性回滚模式
      if (selectMode) {
        selectMode = false;
        selectedIds.clear();
        const btn = Utils.$('#rollbackSelectiveBtn');
        if (btn) {
          btn.textContent = '☑ 选择性回滚';
          btn.style.background = '';
          btn.style.borderColor = '';
          btn.style.color = '';
        }
      }
      
      document.dispatchEvent(new CustomEvent('rollbackPerformed', {
        detail: { opIds, count: opIds.length }
      }));
    }
    
    // ========== 文件回滚（批量）==========
    function rollbackFiles(opIds) {
      if (!App.modules.finder) return;
      
      const moved = App.modules.finder.getMovedFiles();
      const filesToRestore = [];
      
      opIds.forEach(opId => {
        const op = historyOps.find(o => o.id === opId);
        if (!op || op.category !== 'move_file') return;
        
        // 根据操作描述匹配分类
        let category = null;
        if (op.description.includes('截图')) category = 'screenshot';
        else if (op.description.includes('税务')) category = 'tax';
        else if (op.description.includes('PDF')) category = 'pdf_general';
        else if (op.description.includes('安装包')) category = 'installer';
        
        if (category && moved[category]) {
          filesToRestore.push(...moved[category]);
        }
      });
      
      // 批量恢复文件
      if (filesToRestore.length > 0 && App.modules.finder.restoreFiles) {
        App.modules.finder.restoreFiles(filesToRestore);
      } else {
        // fallback：逐个恢复
        filesToRestore.forEach((file, i) => {
          setTimeout(() => {
            App.modules.finder.moveFileBack(file.id, file);
          }, i * 60);
        });
      }
    }
    
    // ========== 回滚后更新信任分 ==========
    function updateTrustScoreOnRollback(opIds) {
      const hasMistake = opIds.some(id => {
        const op = historyOps.find(o => o.id === id);
        return op && op.isMistake;
      });
      
      let scoreDelta = 0;
      
      if (hasMistake) {
        // 误操作回滚，扣 2 分
        scoreDelta = -2;
      } else {
        // 正常回滚，每回滚一个已完成操作扣 0.5 分（最多扣 3 分，即加的分数）
        const rolledBackCompleted = opIds.filter(id => {
          const op = historyOps.find(o => o.id === id);
          return op && op.execStatus === 'completed';
        }).length;
        scoreDelta = -Math.min(3, rolledBackCompleted * 0.5);
      }
      
      finalScore = Math.max(0, finalScore + scoreDelta);
      App.state.trustScore = finalScore;
      
      // 同步更新设置中 Agent 的信任分
      if (App.modules.settings?.updateAgentScore) {
        App.modules.settings.updateAgentScore('a1', finalScore);
      }
      
      // 更新徽章显示（如果徽章展开）
      if (App.modules.badge && App.modules.badge.isExpanded()) {
        App.modules.badge.updateTrustScoreDisplay(finalScore, scoreDelta >= 0 ? 'up' : 'down');
      }
      
      // 显示 toast
      if (scoreDelta !== 0) {
        const text = hasMistake 
          ? '检测到1次误操作，信任分微调 -2'
          : `回滚 ${opIds.length} 个操作，信任分 ${scoreDelta.toFixed(1)}`;
        showScoreChangeToast(text, scoreDelta >= 0 ? 'up' : 'down');
      }
    }
    
    // ========== 显示信任分变化提示 ==========
    function showScoreChangeToast(text, direction) {
      const existing = Utils.$('.score-change-toast');
      if (existing) existing.remove();
      
      const toast = Utils.el('div', 'score-change-toast');
      toast.textContent = text;
      
      if (direction === 'up') {
        toast.style.background = 'rgba(52, 211, 153, 0.15)';
        toast.style.borderColor = 'rgba(52, 211, 153, 0.3)';
        toast.style.color = 'var(--risk-l0)';
      }
      
      document.body.appendChild(toast);
      
      setTimeout(() => toast.classList.add('visible'), 10);
      setTimeout(() => {
        toast.classList.remove('visible');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }
    
    // ========== 更新摘要栏 ==========
    function updateSummary() {
      // 简单重新渲染
      const newSummary = buildSummary();
      const oldSummary = modalEl.querySelector('.history-summary');
      if (oldSummary && newSummary) {
        oldSummary.replaceWith(newSummary);
      }
    }
    
    // ========== 高亮误操作项 ==========
    function highlightMistake(opId, reason) {
      const op = historyOps.find(o => o.id === opId);
      if (op) {
        op.isMistake = true;
        op.mistakeReason = reason;
        mistakeOpId = opId;
      }
      
      if (isOpen) {
        renderTimeline();
      }
    }
    
    // ========== 滚动到指定操作 ==========
    function scrollToOp(opId) {
      const item = modalEl?.querySelector(`[data-op-id="${opId}"]`);
      if (item) {
        item.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    }
    
    // ========== 重置历史数据 ==========
    function reset() {
      historyOps = [];
      rolledBackIds = new Set();
      mistakeOpId = null;
      selectMode = false;
      selectedIds = new Set();
      initialScore = 62;
      finalScore = 62;
    }
    
    // ========== 注册到 App.modules ==========
    function init() {
      App.modules.history = {
        open,
        close,
        reset,
        highlightMistake,
        scrollToOp,
        buildHistoryFromOps,
        performRollback,
        rollbackSingleStep,
        showRollbackPreview,
        showScoreChangeToast,
        setFinalScore: (score) => { finalScore = score; initialScore = score; },
        isOpen: () => isOpen,
        getHistoryOps: () => historyOps
      };
      
      console.log('[AI工牌] 模块6加载完成：操作历史与回滚');
    }
    
    return {
      init
    };
  })();

  /* ========================================

  const TrustDashboard = (() => {
    let isOpen = false;
    let overlayEl = null;
    let modalEl = null;
    
    // 圆环参数
    const RING_RADIUS = 62;
    const RING_CIRCUMFERENCE = 2 * Math.PI * RING_RADIUS;
    
    // ========== 打开看板 ==========
    function open() {
      if (isOpen) return;
      
      render();
      isOpen = true;
      
      document.dispatchEvent(new CustomEvent('trustDashboardOpened'));
    }
    
    // ========== 关闭看板 ==========
    function close() {
      if (!isOpen || !overlayEl) return;
      
      overlayEl.classList.remove('visible');
      setTimeout(() => {
        if (overlayEl && overlayEl.parentNode) {
          overlayEl.parentNode.removeChild(overlayEl);
        }
        overlayEl = null;
        modalEl = null;
        isOpen = false;
      }, 300);
      
      document.dispatchEvent(new CustomEvent('trustDashboardClosed'));
    }
    
    // ========== 获取分数颜色 ==========
    function getScoreColor(score) {
      if (score < 40) return 'var(--risk-l3)';
      if (score < 70) return 'var(--risk-l2)';
      return 'var(--risk-l0)';
    }
    
    function getScoreColorHex(score) {
      if (score < 40) return '#f87171';
      if (score < 70) return '#fbbf24';
      return '#34d399';
    }
    
    // ========== 渲染看板 ==========
    function render() {
      overlayEl = Utils.el('div', 'modal-overlay');

    // ========== 构建进度条行 ==========
    function buildProgressRow() {

      const diff = Math.max(0, 70 - App.state.trustScore);
      row.innerHTML = `
        <span>距自动模式还差 <strong style="color: var(--text-primary)">${diff}</strong> 分</span>

        const item = Utils.el('div', 'skill-item');
        item.style.animationDelay = `${index * 80}ms`;
        
        const color = getScoreColorHex(skill.score);
        
        item.innerHTML = `
          <span class="skill-icon">${skill.icon}</span>
          <span class="skill-name">${skill.name}</span>
          <span class="skill-score">${skill.score}</span>

          </div>
        `;
        
        list.appendChild(item);
      });
      
      return list;
    }
    
    // ========== 构建最近任务 ==========
    function buildRecentTasks() {
      const container = Utils.el('div', 'recent-tasks');
      
      const iconsDiv = Utils.el('div', 'recent-task-icons');
      let successCount = 0;
      
      TRUST_DATA.recentTasks.forEach((result, i) => {
        const icon = Utils.el('div', `recent-task-icon ${result}`);
        icon.textContent = result === 'success' ? '✓' : '✗';
        icon.style.animationDelay = `${i * 80}ms`;
        iconsDiv.appendChild(icon);
        if (result === 'success') successCount++;
      });
      
      const rate = Math.round((successCount / TRUST_DATA.recentTasks.length) * 100);
      const rateSpan = Utils.el('span', 'recent-task-rate', `成功率 ${rate}%`);
      
      container.appendChild(iconsDiv);
      container.appendChild(rateSpan);
      
      return container;
    }
    
    // ========== 构建四因素 ==========
    function buildFactorList() {
      const list = Utils.el('div', 'factor-list');
      
      TRUST_DATA.factors.forEach((factor, index) => {
        const item = Utils.el('div', 'factor-item');
        item.style.animationDelay = `${index * 80}ms`;
        
        const color = factor.score >= 80 ? '#34d399' : factor.score >= 60 ? '#fbbf24' : '#f87171';
        
        item.innerHTML = `
          <div class="factor-top">
            <span class="factor-name">${factor.name}</span>
            <span class="factor-weight">权重 ${factor.weight}</span>
          </div>
          <div style="display: flex; align-items: center;">
            <div class="factor-bar" style="flex: 1;">
              <div class="factor-bar-fill" data-target="${factor.score}" style="width: 0%; background: ${color}"></div>

            <span class="factor-score">${factor.score}%</span>
          </div>

        list.appendChild(item);
      });
      
      return list;

    // ========== 构建升级提示 ==========
    function buildUpgradeTip() {
      const tip = Utils.el('div', 'trust-upgrade-tip');
      tip.innerHTML = '💡 再完成 <strong>3 次无误任务</strong>，将升级为自动模式';
      return tip;
    }
    
    // ========== 进度动画 ==========
    function animateProgress() {
      const score = App.state.trustScore;
      
      // 圆环动画
      const progressCircle = Utils.$('#trustRingProgress');
      if (progressCircle) {
        const offset = RING_CIRCUMFERENCE * (1 - score / 100);
        progressCircle.style.strokeDashoffset = offset.toString();
        progressCircle.style.stroke = getScoreColorHex(score);
      }
      
      // 小进度条（距自动模式）
      const miniProgress = Utils.$('#trustMiniProgress');
      if (miniProgress) {
        const pct = Math.min(100, (score / 70) * 100);
        miniProgress.style.width = pct + '%';
      }
      
      // Skill 进度条
      const skillBars = modalEl?.querySelectorAll('.skill-bar-fill') || [];
      skillBars.forEach((bar, i) => {
        setTimeout(() => {
          const target = bar.getAttribute('data-target');
          bar.style.width = target + '%';
        }, i * 100);
      });
      
      // 因素进度条
      const factorBars = modalEl?.querySelectorAll('.factor-bar-fill') || [];
      factorBars.forEach((bar, i) => {
        setTimeout(() => {
          const target = bar.getAttribute('data-target');
          bar.style.width = target + '%';
        }, i * 100 + 200);
      });
    }
    
    // ========== 更新信任分（动画）==========
    function updateScore(newScore, direction = 'up') {
      const oldScore = App.state.trustScore;
      App.state.trustScore = newScore;
      
      // 数字滚动
      const scoreEl = Utils.$('#trustScoreNumber');
      if (scoreEl) {
        Utils.animateNumber(scoreEl, oldScore, newScore, 1000);
      }
      
      // 圆环更新
      const progressCircle = Utils.$('#trustRingProgress');
      if (progressCircle) {
        const offset = RING_CIRCUMFERENCE * (1 - newScore / 100);
        progressCircle.style.strokeDashoffset = offset.toString();
        progressCircle.style.stroke = getScoreColorHex(newScore);
        
        // 闪烁效果
        progressCircle.style.filter = direction === 'up' 
          ? 'drop-shadow(0 0 8px rgba(52, 211, 153, 0.6))'
          : 'drop-shadow(0 0 8px rgba(251, 191, 36, 0.6))';
        setTimeout(() => {
          if (progressCircle) progressCircle.style.filter = '';
        }, 1000);
      }
      
      // 小进度条更新
      const miniProgress = Utils.$('#trustMiniProgress');
      if (miniProgress) {
        const pct = Math.min(100, (newScore / 70) * 100);
        miniProgress.style.width = pct + '%';
      }
    }

        updateScore,
        isOpen: () => isOpen

      console.log('[AI工牌] 模块7加载完成：信任看板');
    }
    
    return {
      init
    };

    // ========== Tab 5：Agent 管理 ==========
    function buildAgentPane() {
      const pane = Utils.el('div', `settings-tab-pane ${activeTab === 'agent' ? 'active' : ''}`);
      pane.dataset.tab = 'agent';
      
      pane.innerHTML = '<div class="settings-pane-title">Agent 管理</div>';
      
      const list = Utils.el('div', 'agent-list');
      list.id = 'agentManageList';
      
      function renderAgents() {
        list.innerHTML = '';
        AGENTS.forEach(agent => {
          const item = Utils.el('div', 'agent-item');
          const scoreColor = agent.score >= 70 ? 'var(--risk-l0)' : agent.score >= 40 ? 'var(--risk-l2)' : 'var(--risk-l3)';
          item.innerHTML = `
            <div class="agent-avatar">${agent.icon}</div>
            <div class="agent-info">
              <div class="agent-name">${agent.name}</div>
              <div class="agent-meta">
                <span class="agent-score" style="color: ${scoreColor}">${agent.score} 分</span>
                <span>·</span>
                <span>${agent.mode}</span>
                ${agent.status === 'paused' ? '<span style="color: var(--risk-l2)">· 已暂停</span>' : ''}
              </div>
            </div>
            <div class="agent-actions">
              <button class="agent-action-btn" data-action="pause">${agent.status === 'paused' ? '恢复' : '暂停'}</button>
              <button class="agent-action-btn" data-action="reset">重置</button>
              <button class="agent-action-btn danger" data-action="remove">移除</button>
            </div>
          `;
          
          item.querySelectorAll('.agent-action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const action = btn.dataset.action;
              if (action === 'pause') {
                agent.status = agent.status === 'paused' ? 'active' : 'paused';
              } else if (action === 'reset') {
                agent.score = 50;
                // 如果是当前工牌的 Agent，同步更新工牌信任分
                if (agent.id === CURRENT_AGENT_ID) {
                  App.state.trustScore = 50;
                  if (App.modules.badge?.updateTrustScoreDisplay && App.modules.badge.isExpanded()) {
                    App.modules.badge.updateTrustScoreDisplay(50, 'down');
                  }
                }
              } else if (action === 'remove') {
                const idx = AGENTS.findIndex(a => a.id === agent.id);
                if (idx > -1) AGENTS.splice(idx, 1);
              }
              renderAgents();
            });
          });
          
          list.appendChild(item);
        });
      }
      
      renderAgents();
      pane.appendChild(list);
      
      // 添加按钮
      const addBtn = Utils.el('button', 'add-agent-btn', '+ 添加 Agent');
      addBtn.addEventListener('click', () => showAddAgentModal(list));
      pane.appendChild(addBtn);
      
      return pane;
    }

    // ========== 辅助：构建滑块 ==========
    function buildSlider(label, key, min, max) {
      const row = Utils.el('div', 'slider-row');
      const val = state[key];
      const pct = ((val - min) / (max - min)) * 100;
      
      row.innerHTML = `
        <span class="slider-label">${label}</span>
        <div class="slider-track" data-key="${key}" data-min="${min}" data-max="${max}">
          <div class="slider-fill" style="width: ${pct}%"></div>
          <div class="slider-thumb" style="left: ${pct}%"></div>
        </div>
        <span class="slider-value">${val}</span>
      `;
      
      const track = row.querySelector('.slider-track');
      track.addEventListener('click', (e) => {
        const rect = track.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const pct = Math.max(0, Math.min(1, x / rect.width));
        const newVal = Math.round(min + pct * (max - min));
        state[key] = newVal;
        
        const newPct = ((newVal - min) / (max - min)) * 100;
        row.querySelector('.slider-fill').style.width = newPct + '%';
        row.querySelector('.slider-thumb').style.left = newPct + '%';
        row.querySelector('.slider-value').textContent = newVal;
      });
      
      return row;
    }

        </div>
        <div class="toggle-switch ${state[key] ? 'on' : ''}" data-key="${key}"></div>
      `;
      
      const sw = row.querySelector('.toggle-switch');
      sw.addEventListener('click', () => {
        state[key] = !state[key];
        sw.classList.toggle('on', state[key]);
      });
      
      return row;
    }

        function type() {
          if (!isPlaying) { resolve(); return; }
          if (i < text.length) {
            element.value += text.charAt(i);
            i++;
            setTimeout(type, speed);
          } else {
            resolve();
          }
        }
        type();
      });
    }

            // 触发回车
            taskInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            taskInput.dispatchEvent(new KeyboardEvent('keypress', { key: 'Enter' }));
            
            // 徽章变蓝色
            if (App.modules.badge) {
              App.modules.badge.setState('thinking');
            }
            
            // 工牌卡片自动展开，显示分析中
            addTimer(() => {
              if (App.modules.badge) {
                App.modules.badge.toggleExpand(true);
                // 显示分析中状态
                updateBadgeCardAnalyzing();
              }
            }, 300);
          }, 300);
        });
      }, 500);
      
      // 3s 后进入下一场景
      addTimer(() => playScene(1), 3000);
    }
    
    // 更新工牌卡片为「分析中」状态
    function updateBadgeCardAnalyzing() {
      const statusText = document.querySelector('.badge-status-text');
      if (statusText) {
        statusText.textContent = '正在分析任务…';
      }
      const statusDot = document.querySelector('.badge-status-dot');
      if (statusDot) {
        statusDot.className = 'badge-status-dot status-thinking';
      }
      // 隐藏快捷操作下方内容，显示 loading
      const currentTask = document.querySelector('.badge-current-task');
      if (currentTask) {
        currentTask.style.display = 'block';
        currentTask.innerHTML = `
          <div class="badge-task-name" style="display:flex;align-items:center;gap:8px;">
            <span style="width:12px;height:12px;border:2px solid var(--text-tertiary);border-top-color:var(--risk-l1);border-radius:50%;animation:spin 1s linear infinite;display:inline-block;"></span>
            分析任务中…
          </div>
        `;
      }
    }
    
    // ========== Scene 02：计划预览与授权 ==========
    function scene02() {
      // 弹出计划预览 - 交互模式：等待用户点击全部批准
      addTimer(() => {
        if (App.modules.planPreview) {
          App.modules.planPreview.open('帮我整理一下下载文件夹');
          
          // 添加交互引导提示
          addTimer(() => {
            addInteractiveHint();
          }, 500);
          
          // 监听 planApproved 事件（用户点击全部批准后触发）
          function onApproved() {
            if (!isPlaying) return;
            document.removeEventListener('planApproved', onApproved);
            // 恢复进度条
            if (isPaused) {
              totalPausedDuration += Date.now() - pauseStartTime;
              isPaused = false;
            }
            // 等面板关闭动画完成后进入下一场景
            addTimer(() => playScene(2), 400);
          }
          document.addEventListener('planApproved', onApproved);
          timers.push({ _event: { target: document, type: 'planApproved', handler: onApproved } });
          
          // 兜底：30秒后自动继续（防止卡住）
          addTimer(() => {
            const approveAll = document.querySelector('#planApproveAllBtn');
            if (approveAll && isPlaying) {
              approveAll.click();
            }
          }, 30000);
        }
      }, 300);
    }
    
    // 添加交互引导提示
    function addInteractiveHint() {
      const planModal = document.querySelector('.plan-preview-modal');
      if (!planModal) return;
      
      // 检查是否已经有提示了
      if (planModal.querySelector('.demo-interactive-hint')) return;
      
      const hint = Utils.el('div', 'demo-interactive-hint');
      hint.style.cssText = `
        position: absolute;
        top: -36px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 14px;
        background: rgba(96, 165, 250, 0.95);
        color: #fff;
        font-size: 11px;
        font-weight: 500;
        border-radius: 20px;
        white-space: nowrap;
        animation: bounceDown 0.6s ease-out;
        z-index: 10;
        box-shadow: 0 4px 12px rgba(96, 165, 250, 0.4);
      `;
      hint.innerHTML = '👆 试试拒绝高风险操作，然后点「全部批准」';
      
      // 添加小三角
      const arrow = Utils.el('div', '');
      arrow.style.cssText = `
        position: absolute;
        bottom: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 6px solid transparent;
        border-right: 6px solid transparent;
        border-top: 6px solid rgba(96, 165, 250, 0.95);
      `;
      hint.appendChild(arrow);
      
      planModal.style.position = 'relative';
      planModal.appendChild(hint);
      
      // 5 秒后淡出
      addTimer(() => {
        hint.style.opacity = '0';
        hint.style.transition = 'opacity 0.3s';
        setTimeout(() => {
          if (hint.parentNode) hint.parentNode.removeChild(hint);
        }, 300);
      }, 5000);
    }
    
    // ========== Scene 03：实时执行 ==========
    function scene03() {
      // 打开执行面板
      addTimer(() => {
        if (App.modules.execStream) {
          App.modules.execStream.showPanel();
          App.modules.execStream.start(App.state.currentOperations, { rejectedOpIds: ['op_6'] });
        }
      }, 200);
      
      // 12s 后进入下一场景（到 op_7 税务文件处暂停）
      addTimer(() => playScene(3), 12000);
    }
    
    // ========== Scene 04：发现错误与待复查 ==========
    function scene04() {
      // 暂停执行并显示升级提示
      addTimer(() => {
        if (App.modules.execStream) {
          App.modules.execStream.pause();
          
          // 徽章变橙色闪烁（等待确认）
          if (App.modules.badge) {
            App.modules.badge.setState('waiting');
          }
          
          // 给 op_7 添加升级提示
          const op7Item = document.querySelector('.exec-op-item[data-op-id="op_7"]');
          if (op7Item) {
            op7Item.classList.add('waiting-confirm');
            
            const content = op7Item.querySelector('.exec-op-content');
            if (content && !content.querySelector('.exec-upgrade-notice')) {
              const notice = Utils.el('div', 'exec-upgrade-notice');
              notice.style.cssText = `
                margin-top: 8px;
                padding: 8px 10px;
                background: rgba(251, 191, 36, 0.1);
                border: 1px solid rgba(251, 191, 36, 0.25);
                border-radius: 6px;
                font-size: 11px;
                color: var(--risk-l2);
                line-height: 1.5;
              `;
              notice.innerHTML = `
                <div style="font-weight:600;margin-bottom:2px;">⚠️ 检测到敏感目录「税务」</div>
                <div style="color: var(--text-secondary);">风险从 L1 升级为 L2</div>
                <div style="color: var(--text-tertiary);margin-top:2px;">文件：税务培训通知.pdf</div>
              `;
              content.appendChild(notice);
              
              // 添加三个按钮
              const btns = Utils.el('div', '');
              btns.style.cssText = 'display:flex;gap:6px;margin-top:8px;';
              btns.innerHTML = `
                <button class="exec-confirm-btn" style="padding:4px 12px;background:rgba(52,211,153,0.15);border:1px solid rgba(52,211,153,0.3);border-radius:4px;color:var(--risk-l0);font-size:10px;cursor:pointer;">确认移动</button>
                <button class="exec-review-btn" style="padding:4px 12px;background:rgba(251,191,36,0.15);border:1px solid rgba(251,191,36,0.3);border-radius:4px;color:var(--risk-l2);font-size:10px;cursor:pointer;">标记待复查</button>
                <button class="exec-skip-btn" style="padding:4px 12px;background:rgba(255,255,255,0.06);border:1px solid var(--card-border);border-radius:4px;color:var(--text-secondary);font-size:10px;cursor:pointer;">跳过</button>
              `;
              content.appendChild(btns);
              
              // 点击「标记待复查」
              const reviewBtn = btns.querySelector('.exec-review-btn');
              addTimer(() => {
                if (reviewBtn) reviewBtn.click();
                // 标记待复查后继续执行
                addTimer(() => {
                  if (App.modules.execStream) {
                    // 标记为待复查状态
                    App.modules.execStream.markForReview('op_7');
                    App.modules.execStream.resume();
                  }
                  if (App.modules.badge) {
                    App.modules.badge.setState('thinking');
                  }
                }, 600);
              }, 1500);
            }
          }
        }
      }, 500);
      
      // 6s 后进入下一场景
      addTimer(() => playScene(4), 6000);
    }
    
    // ========== Scene 05：回滚与信任变化 ==========
    function scene05() {
      // 各场景的回档配置
      const ROLLBACK_CONFIG = {
        organize: {
          finalScore: 65,
          scoreDirection: 'up',
          badgeText: '✅ 任务完成！7/8 成功，1个待复查',
          hasError: true,
          errorOpId: 'op_4',
          errorTitle: '⚠️ 工作文档_项目计划.docx 被误移到PDF归档',
          errorDesc: '该文件是 .docx 格式，不应被移动到 PDF 目录',
          rollbackType: 'single',
          completeStats: [
            { value: 7, label: '操作成功' },
            { value: 1, label: '已回滚' },
            { value: 65, label: '信任分' }
          ]
        },
        clear: {
          finalScore: 43,
          scoreDirection: 'down',
          badgeText: '⚠️ 任务完成！4/5 成功，1个误删已恢复',
          hasError: true,
          errorOpId: 'op_4',
          errorTitle: '⚠️ 合同_2025.pdf 被误删除',
          errorDesc: '该文件为重要合同文档，不应被批量删除，已从回收站恢复',
          rollbackType: 'single',
          completeStats: [
            { value: 4, label: '操作成功' },
            { value: 1, label: '已恢复' },
            { value: 43, label: '信任分' }
          ]
        },
        peek: {
          finalScore: 42,
          scoreDirection: 'up',
          badgeText: '✅ 任务完成！4/4 全部成功，零风险操作',
          hasError: false,
          errorOpId: null,
          errorTitle: '',
          errorDesc: '',
          rollbackType: 'none',
          completeStats: [
            { value: 4, label: '操作成功' },
            { value: 0, label: '风险操作' },
            { value: 42, label: '信任分' }
          ]
        },
        tax: {
          finalScore: 64,
          scoreDirection: 'up',
          badgeText: '✅ 任务完成！6/7 成功，1个已纠正',
          hasError: true,
          errorOpId: 'op_5',
          errorTitle: '⚠️ 税务培训通知.pdf 被误归为税务文件',
          errorDesc: '该文件为公司内部培训材料，不属于个人税务归档范围',
          rollbackType: 'single',
          completeStats: [
            { value: 6, label: '操作成功' },
            { value: 1, label: '已纠正' },
            { value: 64, label: '信任分' }
          ]
        }
      };
      
      const cfg = ROLLBACK_CONFIG[currentSceneKey] || ROLLBACK_CONFIG.organize;
      const initialScore = App.state.trustScore;
      
      // 等待执行完成
      addTimer(() => {
        // 显示任务完成
        if (App.modules.badge) {
          App.modules.badge.setState('idle');
        }
        
        // 信任分变化动画
        if (App.modules.badge) {
          App.modules.badge.updateTrustScoreDisplay(cfg.finalScore, cfg.scoreDirection);
        }
        // 同步历史面板的信任分
        if (App.modules.history) {
          App.modules.history.setFinalScore(cfg.finalScore);
        }
        
        // 显示完成提示
        showCompletionOnBadge(cfg.badgeText);
        
        // peek 场景（观察模式）：没有误操作，直接展示成功
        if (!cfg.hasError) {
          // 2秒后打开操作历史，展示全部成功
          addTimer(() => {
            if (App.modules.history) {
              App.modules.history.open();
            }
          }, 2000);
          
          // 8s 后显示完成
          addTimer(() => {
            showComplete(cfg.completeStats);
          }, 8000);
          return;
        }
        
        // 有误操作的场景：打开历史 → 高亮误操作 → 回滚
        // 2秒后打开操作历史
        addTimer(() => {
          if (App.modules.history) {
            App.modules.history.open();
          }
          
          // 高亮误操作项，显示误操作警告
          addTimer(() => {
            const historyItems = document.querySelectorAll('.timeline-item');
            historyItems.forEach(item => {
              if (item.dataset.opId === cfg.errorOpId) {
                // 闪烁高亮
                item.style.animation = 'none';
                item.offsetHeight; // 触发 reflow
                item.style.animation = 'pulse 1s ease-in-out 2';
                
                // 显示误操作警告
                if (!item.querySelector('.timeline-error')) {
                  const errorBox = Utils.el('div', 'timeline-error');
                  errorBox.style.cssText = `
                    margin-top: 8px;
                    padding: 8px 10px;
                    background: rgba(251, 191, 36, 0.1);
                    border: 1px solid rgba(251, 191, 36, 0.25);
                    border-radius: 6px;
                    font-size: 11px;
                    color: var(--risk-l2);
                    line-height: 1.5;
                  `;
                  errorBox.innerHTML = `
                    <div style="font-weight:600;">${cfg.errorTitle}</div>
                    <div style="color: var(--text-secondary);margin-top:2px;">${cfg.errorDesc}</div>
                  `;
                  item.querySelector('.timeline-content').appendChild(errorBox);
                  
                  // 添加回滚按钮
                  const rollbackBtn = Utils.el('button', '');
                  rollbackBtn.style.cssText = `
                    margin-top: 6px;
                    padding: 4px 12px;
                    background: rgba(248, 113, 113, 0.15);
                    border: 1px solid rgba(248, 113, 113, 0.3);
                    border-radius: 4px;
                    color: var(--risk-l3);
                    font-size: 10px;
                    font-weight: 500;
                    cursor: pointer;
                  `;
                  rollbackBtn.textContent = '↩ 回滚此操作';
                  rollbackBtn.addEventListener('click', () => {
                    if (App.modules.history) {
                      App.modules.history.showRollbackPreview([cfg.errorOpId], cfg.rollbackType);
                    }
                  });
                  item.querySelector('.timeline-content').appendChild(rollbackBtn);
                  
                  // 自动点击回滚
                  addTimer(() => {
                    rollbackBtn.click();
                    
                    // 回滚预览弹出后自动确认
                    addTimer(() => {
                      const confirmBtn = document.querySelector('#rollbackConfirmBtn');
                      if (confirmBtn) confirmBtn.click();
                    }, 800);
                  }, 1200);
                }
              }
            });
          }, 1000);
        }, 2000);
        
        // 10s 后显示完成
        addTimer(() => {
          showComplete(cfg.completeStats);
        }, 10000);
      }, 500);
    }
    
    // 工牌卡片显示完成状态
    function showCompletionOnBadge(text) {
      const taskName = document.querySelector('.badge-task-name');
      if (taskName) {
        taskName.innerHTML = text || '✅ 任务完成！';
      }
      const taskProgress = document.querySelector('.badge-task-progress');
      if (taskProgress) {
        taskProgress.style.display = 'none';
      }
    }
    
    // ========== 显示完成覆盖层 ==========
    function showComplete(customStats) {
      // 停止播放状态
      isPlaying = false;
      App.state.isDemoPlaying = false;
      
      // 清除监听器
      document.removeEventListener('click', handleClickSkip);
      document.removeEventListener('keydown', handleKeySkip);
      
      // 移除进度条和标签
      if (progressBar && progressBar.parentNode) {
        progressBar.parentNode.removeChild(progressBar);
        progressBar = null;
      }
      if (sceneLabel && sceneLabel.parentNode) {
        sceneLabel.parentNode.removeChild(sceneLabel);
        sceneLabel = null;
      }
      if (skipHint && skipHint.parentNode) {
        skipHint.parentNode.removeChild(skipHint);
        skipHint = null;
      }
      
      // 默认统计数据
      const stats = customStats || [
        { value: 8, label: '操作数' },
        { value: 1, label: '待复查' },
        { value: 65, label: '信任分' }
      ];
      
      // 显示完成通知（右下角滑入）
      const overlay = Utils.el('div', 'demo-overlay');
      overlay.innerHTML = `
        <div class="demo-complete-card">
          <button class="demo-complete-close" id="demoCompleteClose" title="关闭">×</button>
          <div class="demo-complete-icon">🎉</div>
          <div class="demo-complete-title">Demo 完成</div>
          <div class="demo-complete-subtitle">
            AI工牌 · 信任基础设施<br>
            可控 · 可查 · 可回滚
          </div>
          <div class="demo-complete-stats">
            ${stats.map((s, i) => `
              <div class="demo-complete-stat">
                <div class="demo-complete-stat-value" id="statVal${i}" style="${i === stats.length - 1 ? 'color: var(--risk-l2);' : ''}">0</div>
                <div class="demo-complete-stat-label">${s.label}</div>
              </div>
            `).join('')}
          </div>
          <button class="demo-replay-btn" id="demoReplayBtn">🔄 重新播放</button>
        </div>
      `;
      
      overlay.querySelector('#demoReplayBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        overlay.remove();
        // 重置按钮
        const demoBtn = Utils.$('#demoBtn');
        if (demoBtn) {
          demoBtn.classList.remove('playing');
          demoBtn.innerHTML = '<i data-lucide="play" style="width:10px;height:10px;fill:currentColor;"></i> 演示';
          if (window.lucide) lucide.createIcons();
        }
        // 用当前场景重新播放
        const preset = SCENE_PRESETS[currentSceneKey] || SCENE_PRESETS.organize;
        start(preset.user_input, {
          scene: currentSceneKey,
          trust_score: preset.trust_score,
          mode: preset.mode
        });
      });
      
      overlay.querySelector('#demoCompleteClose').addEventListener('click', (e) => {
        e.stopPropagation();
        // 滑出动画
        const card = overlay.querySelector('.demo-complete-card');
        if (card) {
          card.style.animation = 'slideInRight 0.3s ease-in reverse';
          setTimeout(() => overlay.remove(), 300);
        } else {
          overlay.remove();
        }
        // 重置按钮
        const demoBtn = Utils.$('#demoBtn');
        if (demoBtn) {
          demoBtn.classList.remove('playing');
          demoBtn.innerHTML = '<i data-lucide="play" style="width:10px;height:10px;fill:currentColor;"></i> 演示';
          if (window.lucide) lucide.createIcons();
        }
      });
      
      document.body.appendChild(overlay);
      
      // 数字依次计数动画
      stats.forEach((s, i) => {
        setTimeout(() => {
          const el = overlay.querySelector(`#statVal${i}`);
          if (!el) return;
          const duration = 800;
          const startTime = performance.now();
          const animate = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            el.textContent = Math.round(s.value * eased);
            if (progress < 1) requestAnimationFrame(animate);
            else el.textContent = s.value;
          };
          requestAnimationFrame(animate);
        }, i * 200);
      });
    }
    
    // ========== 初始化 ==========
    function init() {
      const demoBtn = Utils.$('#demoBtn');
      if (demoBtn) {
        demoBtn.addEventListener('click', () => {
          if (isPlaying) {
            stop();
          } else {
            start();
          }
        });
      }
      
      // 快捷场景按钮
      const chips = document.querySelectorAll('.scene-chip');
      chips.forEach(chip => {
        chip.addEventListener('click', () => {
          if (isPlaying) return;
          const sceneKey = chip.dataset.scene;
          const preset = SCENE_PRESETS[sceneKey];
          if (preset) {
            start(preset.user_input, {
              scene: sceneKey,
              trust_score: preset.trust_score,
              mode: preset.mode
            });
          }
        });
      });
      
      // 输入框回车触发审查
      const taskInput = Utils.$('#taskInput');
      if (taskInput) {
        taskInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !isPlaying) {
            const val = taskInput.value.trim();
            if (val) {
              start(val);
            }
          }
        });
      }
      
      App.modules.demo = {
        start,
        stop,
        isPlaying: () => isPlaying
      };
      
      console.log('[AI工牌] 模块9加载完成：Demo 演示模式');
    }
    
    return {
      init
    };
  })();
  
  document.addEventListener('DOMContentLoaded', () => {
    DemoPlayer.init();
  });
  
  if (document.readyState !== 'loading') {
    DemoPlayer.init();
  }
</script>
