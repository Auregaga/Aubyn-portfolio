<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dither Hover Reveal - 图片悬停揭示效果</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #ffffff;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 32px;
    }

    .title {
      text-align: center;
    }

    .title h1 {
      font-size: 24px;
      font-weight: 700;
      color: #111;
      margin-bottom: 8px;
    }

    .title p {
      font-size: 14px;
      color: #888;
    }

    .demo-container {
      position: relative;
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      cursor: pointer;
    }

    .demo-container img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      -webkit-user-drag: none;
    }

    .demo-container canvas {
      position: absolute;
      inset: 0;
      width: 100%;

      object-fit: cover;

      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .demo-container:hover canvas {
      opacity: 0;
    }

    .hint {
      font-size: 13px;
      color: #aaa;
      text-align: center;
    }

    .controls {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
    }

    .control-group label {
      font-size: 12px;
      color: #666;
    }

    .control-group select,
    .control-group input[type="range"] {
      padding: 6px 10px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #111;
      min-width: 120px;
    }
  </style>
</head>
<body>
  <div class="title">
    <h1>Dither Hover Reveal</h1>
    <p>悬停图片查看效果 · Bayer Ordered Dither</p>
  </div>

  <div class="demo-container" id="demoContainer">
    <img id="originalImage" alt="Portrait" />
    <canvas id="ditherCanvas"></canvas>
  </div>

  <p class="hint">将鼠标悬停在图片上 → 平滑揭示原始照片</p>

  <div class="controls">
    <div class="control-group">
      <label for="matrixSize">矩阵大小</label>
      <select id="matrixSize">
        <option value="8">8x8（精细）</option>
        <option value="4">4x4（粗犷）</option>
      </select>
    </div>
    <div class="control-group">
      <label for="threshold">阈值偏移: <span id="thresholdValue">0</span></label>
      <input type="range" id="threshold" min="-50" max="50" value="0" />
    </div>
    <div class="control-group">
      <label for="darkColor">暗部颜色</label>
      <select id="darkColor">
        <option value="#999999">#999（中灰）</option>
        <option value="#888888">#888（深灰）</option>
        <option value="#aaaaaa">#aaa（浅灰）</option>
        <option value="#111111">#111（纯黑）</option>
      </select>
    </div>
  </div>

  <script>
    /**
     * ============================================================
     *  Bayer Ordered Dither - 有序抖动算法
     * ============================================================
     * 
     * 可调节参数：
     * - matrixSize: Bayer 矩阵大小（4 或 8），值越大细节越丰富
     * - lightColor: 亮部颜色（白点）
     * - darkColor: 暗部颜色（灰点）
     * - threshold: 灰度阈值偏移（-50 ~ 50），正值整体更亮，负值整体更暗
     * - scale: 输出缩放比例，默认 1，值越小像素感越强
     */

    // Bayer 4x4 阈值矩阵
    const BAYER_4X4 = [
      [ 0,  8,  2, 10],
      [12,  4, 14,  6],
      [ 3, 11,  1,  9],
      [15,  7, 13,  5],
    ].map(row => row.map(v => (v / 16) * 255));

    // Bayer 8x8 阈值矩阵
    const BAYER_8X8 = [
      [ 0, 32,  8, 40,  2, 34, 10, 42],
      [48, 16, 56, 24, 50, 18, 58, 26],
      [12, 44,  4, 36, 14, 46,  6, 38],
      [60, 28, 52, 20, 62, 30, 54, 22],
      [ 3, 35, 11, 43,  1, 33,  9, 41],
      [51, 19, 59, 27, 49, 17, 57, 25],
      [15, 47,  7, 39, 13, 45,  5, 37],
      [63, 31, 55, 23, 61, 29, 53, 21],
    ].map(row => row.map(v => (v / 64) * 255));

    /**
     * 解析 hex 颜色为 RGB
     */
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      if (!result) return [255, 255, 255];
      return [parseInt(result[1], 16), parseInt(result[2], 16), parseInt(result[3], 16)];
    }

    /**
     * 对 ImageData 应用 Bayer Ordered Dither
     * 返回新的 ImageData（两色点阵效果）
     */
    function bayerDither(imageData, options = {}) {
      const {
        matrixSize = 8,
        lightColor = '#ffffff',
        darkColor = '#999999',
        threshold = 0,
        scale = 1,
      } = options;

      const matrix = matrixSize === 4 ? BAYER_4X4 : BAYER_8X8;
      const [lightR, lightG, lightB] = hexToRgb(lightColor);
      const [darkR, darkG, darkB] = hexToRgb(darkColor);

      const { width, height, data } = imageData;
      const outputWidth = Math.floor(width * scale);
      const outputHeight = Math.floor(height * scale);

      // 创建输出画布
      const outputCanvas = document.createElement('canvas');
      outputCanvas.width = outputWidth;
      outputCanvas.height = outputHeight;
      const outputCtx = outputCanvas.getContext('2d');
      const outputData = outputCtx.createImageData(outputWidth, outputHeight);
      const output = outputData.data;

      // 逐像素处理
      for (let y = 0; y < outputHeight; y++) {
        for (let x = 0; x < outputWidth; x++) {
          const srcX = Math.floor(x / scale);
          const srcY = Math.floor(y / scale);
          const srcIdx = (srcY * width + srcX) * 4;

          // Luma 灰度公式
          const r = data[srcIdx];
          const g = data[srcIdx + 1];
          const b = data[srcIdx + 2];
          const gray = 0.299 * r + 0.587 * g + 0.114 * b;

          // Bayer 阈值比较
          const bayerValue = matrix[y % matrixSize][x % matrixSize];
          const isLight = (gray + threshold) > bayerValue;

          const outIdx = (y * outputWidth + x) * 4;
          if (isLight) {
            output[outIdx] = lightR;
            output[outIdx + 1] = lightG;
            output[outIdx + 2] = lightB;
            output[outIdx + 3] = 255;
          } else {
            output[outIdx] = darkR;
            output[outIdx + 1] = darkG;
            output[outIdx + 2] = darkB;
            output[outIdx + 3] = 255;
          }
        }
      }

      return outputData;
    }

    /**
     * 从图片 URL 渲染 dither 效果到 canvas
     */
    function renderDither(imageSrc, canvas, options = {}) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';

        img.onload = () => {
          const { scale = 1 } = options;
          const outputWidth = Math.floor(img.width * scale);
          const outputHeight = Math.floor(img.height * scale);

          const tempCanvas = document.createElement('canvas');
          tempCanvas.width = img.width;
          tempCanvas.height = img.height;
          const tempCtx = tempCanvas.getContext('2d');
          tempCtx.drawImage(img, 0, 0);

          const imageData = tempCtx.getImageData(0, 0, img.width, img.height);
          const ditheredData = bayerDither(imageData, options);

          canvas.width = outputWidth;
          canvas.height = outputHeight;
          const ctx = canvas.getContext('2d');
          ctx.putImageData(ditheredData, 0, 0);

          resolve();
        };

        img.onerror = reject;
        img.src = imageSrc;
      });
    }

    // ============================================================
    //  演示页面逻辑
    // ============================================================

    const canvas = document.getElementById('ditherCanvas');
    const img = document.getElementById('originalImage');
    const matrixSelect = document.getElementById('matrixSize');
    const thresholdSlider = document.getElementById('threshold');
    const thresholdValue = document.getElementById('thresholdValue');
    const darkColorSelect = document.getElementById('darkColor');

    // 这里使用 base64 或外部图片；直接使用用户照片（需要本地服务器或 file:// 访问时可能有 CORS 限制）
    // 为了在本地直接打开能用，我们用一张内置的演示图
    // 实际项目中替换为你的图片路径
    const imageSrc = 'portrait.jpg';

    let currentOptions = {
      matrixSize: 8,
      lightColor: '#ffffff',
      darkColor: '#999999',
      threshold: 0,
      scale: 1,
    };

    function updateDither() {
      img.src = imageSrc;
      renderDither(imageSrc, canvas, currentOptions).catch((err) => {
        console.warn('图片加载失败（本地 file:// 打开时可能有 CORS 限制）：', err);
        // 生成一个占位渐变图用于演示
        generatePlaceholderDither();
      });
    }

    function generatePlaceholderDither() {
      const w = 400, h = 400;
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = w;
      tempCanvas.height = h;
      const ctx = tempCanvas.getContext('2d');

      // 绘制渐变色占位图（模拟人像轮廓）
      const gradient = ctx.createRadialGradient(w/2, h/2.5, 50, w/2, h/2, 200);
      gradient.addColorStop(0, '#dddddd');
      gradient.addColorStop(0.5, '#bbbbbb');
      gradient.addColorStop(1, '#888888');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, w, h);

      // 画一个圆形"脸"
      ctx.fillStyle = '#cccccc';
      ctx.beginPath();
      ctx.arc(w/2, h/2.5, 100, 0, Math.PI * 2);
      ctx.fill();

      const imageData = ctx.getImageData(0, 0, w, h);
      const ditheredData = bayerDither(imageData, currentOptions);

      canvas.width = w;
      canvas.height = h;
      const outCtx = canvas.getContext('2d');
      outCtx.putImageData(ditheredData, 0, 0);

      // 原图也用渐变
      img.src = tempCanvas.toDataURL();
    }

    // 事件监听
    matrixSelect.addEventListener('change', (e) => {
      currentOptions.matrixSize = parseInt(e.target.value);
      updateDither();
    });

    thresholdSlider.addEventListener('input', (e) => {
      currentOptions.threshold = parseInt(e.target.value);
      thresholdValue.textContent = e.target.value;
    });

    thresholdSlider.addEventListener('change', () => {
      updateDither();
    });

    darkColorSelect.addEventListener('change', (e) => {
      currentOptions.darkColor = e.target.value;
      updateDither();
    });

    // 初始化
    updateDither();
  </script>
</body>
</html>
